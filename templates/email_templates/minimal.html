<!DOCTYPE html>
<html lang="{{ lang }}" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ title|default(t.title_message, true) }}</title>
  <!--[if mso]>
  <xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>
  <![endif]-->
  <style>
    @media only screen and (max-width: 620px) {
      .es-wrapper { width: 100% !important; }
      .es-pad { padding-left: 22px !important; padding-right: 22px !important; }
      .es-title { font-size: 21px !important; line-height: 29px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#ffffff; -webkit-font-smoothing:antialiased;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ title }}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" class="es-wrapper" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; max-width:560px; background-color:#ffffff;">

          <!-- Petit logo, masqué s'il n'y en a pas -->
          {% if logo_url %}
          <tr>
            <td class="es-pad" align="left" style="padding:0 8px 26px 8px;">
              <img src="{{ logo_url }}" alt="{{ company_name|default(t.logo_alt, true) }}" width="72" style="display:block; max-width:72px; height:auto; border:0; outline:none; text-decoration:none; opacity:0.95;">
            </td>
          </tr>
          {% endif %}

          <!-- Titre -->
          <tr>
            <td class="es-pad" align="left" style="padding:0 8px 0 8px;">
              <h1 class="es-title" style="margin:0; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:22px; line-height:31px; font-weight:600; color:#0f172a;">
                {{ title }}
              </h1>
            </td>
          </tr>

          <!-- Corps aéré -->
          <tr>
            <td class="es-pad" align="left" style="padding:20px 8px 0 8px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:16px; line-height:28px; color:#3f4a5a;">
              {{ body }}
            </td>
          </tr>

          <!-- Blocs optionnels : vides si les champs ne sont pas remplis -->
          {{ video_block }}
          {{ cta_block }}
          <!-- Signature simple -->
          {% if signature %}
          <tr>
            <td class="es-pad" align="left" style="padding:14px 8px 0 8px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#64748b;">
              {{ signature }}
            </td>
          </tr>
          {% endif %}

          <!-- Pied de page minimal -->
          <tr>
            <td class="es-pad" align="left" style="padding:34px 8px 0 8px;">
              {{ social_block }}
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="border-top:1px solid #edf1f6; height:1px; line-height:1px; font-size:0;">&nbsp;</td></tr>
                <tr>
                  <td style="padding-top:14px; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:11px; line-height:18px; color:#a3aebf;">
                    {% if company_name %}<span style="color:{{ accent_color }};">{{ company_name }}</span> &middot; {% endif %}{{ year }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>
</body>
</html>
